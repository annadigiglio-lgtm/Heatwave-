# ============================================================================
# HEATWAVE PIEMONTE - Configuration File
# Configurazione centrale per il progetto di analisi delle ondate di calore
# ============================================================================

# --- DATABASE ---
database:
  host: "localhost"
  port: 5432
  database: "heatwave_piemonte"
  user: "postgres"
  password: "your_password"  # DA CAMBIARE - usare variabili d'ambiente in produzione
  schema: "public"
  srid: 4326  # EPSG code per le coordinate geografiche

# --- DATA SOURCES ---
data_sources:
  open_meteo:
    enabled: true
    url: "https://archive-api.open-meteo.com/v1/archive"
    format: "json"
    description: "Free meteorological API - Temperature, precipitation data"
    rate_limit: 10000  # requests per day

  copernicus:
    enabled: true
    url: "https://cds.climate.copernicus.eu/api/v2"
    dataset: "reanalysis-era5-single-levels"
    variables:
      - "2m_temperature"
      - "total_precipitation"
      - "surface_pressure"
    product_type: "reanalysis"
    format: "netcdf"
    area: [47.1, 5.8, 44.0, 9.8]
    description: "Copernicus ERA5 climate data for Piemonte bounding box"

  arpa_piemonte:
    enabled: false
    url: "https://www.arpa.piemonte.it/dati/climatici"
    download_type: "csv"
    description: "Dati climatici ARPA Piemonte per stazioni e serie storiche (opzionale)"

  istat:
    enabled: false
    municipalities_url: "https://www.istat.it/storage/cartografia/confini_amministrativi/generalizzati/2026/Limiti01012026_g.zip"
    provinces_url: "https://www.istat.it/it/archivio/6789"
    description: "Confini amministrativi ISTAT (comuni/province), aggiornati al 1 gennaio dell'anno di riferimento (opzionale)"

  openstreetmap:
    enabled: false
    nominatim_url: "https://nominatim.openstreetmap.org/search.php"
    user_agent: "HeatwavePiemonte/1.0"
    description: "Dati OSM per confini amministrativi e geometrie territoriali (opzionale)"

# --- PATHS ---
paths:
  raw_data: "./data/raw"
  processed_data: "./data/processed"
  external_data: "./data/external"
  sql_scripts: "./sql"
  output: "./output"
  dashboard_export: "./data/dashboard_export"
  logs: "./logs"

# --- PROCESSING PARAMETERS ---
processing:
  temperature_thresholds:
    extreme_heat_1: 30  # Caldo moderato (°C)
    extreme_heat_2: 35  # Caldo intenso (°C)
    extreme_heat_3: 40  # Caldo estremo (°C)
  
  heatwave_duration_days: 3  # Minimo giorni consecutivi per ondata di calore
  
  date_range:
    start_year: 2000
    end_year: 2026
  
  regions:
    - "Alessandria"
    - "Asti"
    - "Biella"
    - "Cuneo"
    - "Novara"
    - "Torino"
    - "Verbano-Cusio-Ossola"
    - "Vercelli"

# --- LOGGING ---
logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level: <8} | {name}:{function}:{line} - {message}"
  file: "./logs/heatwave_piemonte.log"
  console: true

# --- VISUALIZATION ---
visualization:
  style: "seaborn"
  color_palette: "RdYlBu_r"
  figure_dpi: 300
  figure_format: "png"

# --- DASHBOARD ---
dashboard:
  port: 8501
  title: "Il riscaldamento del Piemonte: analisi spazio-temporale dei trend termici e delle ondate di calore"
  theme: "light"
  max_upload_size: 200  # MB

# --- MACHINE LEARNING ---
ml:
  random_seed: 42
  cv_folds: 5
  models_dir: "./models"

# --- CHATBOT (assistente climatico: LLM + agenti + RAG) ---
# Specifica completa in wiki/pages/chatbot.md
chatbot:
  provider: "gemini"            # gemini (veloce, GOOGLE_API_KEY) | ollama (locale, lento su CPU) | anthropic (ANTHROPIC_API_KEY)
  model: "qwen2.5:7b"           # alternativa leggera: llama3.2
  anthropic_model: ""           # da impostare solo se provider = anthropic
  gemini_model: "gemini-3.1-flash-lite"  # 2026-10-24: 1,9-11,8 s, 6/6 corrette; 3.5-flash ha solo 20 richieste/giorno nel piano gratuito
  riserva: "ollama"             # se Gemini non risponde (quota, rete, servizio) si passa da soli al modello locale
  gemini_thinking_budget: 0     # 0 = niente "ragionamento" interno: risposte brevi non vuote
  temperature: 0.2
  max_iterations: 5             # limite del ciclo dell'agente
  preselezione_tool: true       # domande inequivocabili: il tool lo sceglie Python, 1 sola chiamata LLM
  num_predict: 200              # token massimi per risposta: su questo PC si generano ~3 token/s
  request_timeout: 180          # secondi massimi di attesa di una risposta LLM
  keep_alive: "30m"             # tiene il modello in RAM tra le domande (prima chiamata su CPU: ~44 s)
  memory_window: 6              # ultimi N scambi passati all'LLM
  prompt_version: "v2"
  cache_risposte:
    enabled: true               # domande già poste (stessi dati, prompt e modello) servite all'istante
    dir: "./data/cache_risposte"
  rag:
    persist_dir: "./data/vector_store"   # indice: embeddings .npy + chunk .parquet
    index_name: "heatwave_docs"
    embedding_model: "bge-m3"             # modello di embedding multilingue servito da Ollama
    chunk_words: 300
    overlap_words: 50
    top_k: 3                    # 3 chunk accorciati a ~120 parole: su CPU ogni token di contesto costa
